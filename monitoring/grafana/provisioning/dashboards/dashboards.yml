apiVersion: 1

providers:
  - name: "DevSecOps Dashboards"
    orgId: 1
    folder: "DevSecOps Observability"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
