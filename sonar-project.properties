# ==========================================
# SonarQube / SonarCloud Static Code Analysis
# ==========================================

sonar.projectKey=cloud-native-devsecops-pipeline
sonar.projectName=Cloud-Native DevSecOps Deployment Pipeline
sonar.projectVersion=1.0.0

# Source & Test Code Configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Code Coverage & Test Reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=node_modules/**,coverage/**,monitoring/**,terraform/**,scripts/**,**/*.test.js
sonar.test.inclusions=tests/**/*.test.js

# Quality Gate Threshold Expectations
sonar.qualitygate.wait=true
