version: '3.8'

services:
  # ==========================================
  # 1. DevSecOps Hardened Web Application
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-native-devsecops-app:latest
    container_name: devsecops-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8082}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - APP_NAME=cloud-native-devsecops-app
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devsecops-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # 2. Prometheus Monitoring & Telemetry
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: devsecops-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - devsecops-net
    depends_on:
      - app

  # ==========================================
  # 3. Grafana Analytics & Dashboards
  # ==========================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: devsecops-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3005}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - devsecops-net
    depends_on:
      - prometheus

  # ==========================================
  # 4. cAdvisor Container Resource Metrics
  # ==========================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: devsecops-cadvisor
    restart: unless-stopped
    ports:
      - "${CADVISOR_PORT:-8085}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - devsecops-net

  # ==========================================
  # 5. Node Exporter Host OS Metrics
  # ==========================================
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: devsecops-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - devsecops-net

networks:
  devsecops-net:
    driver: bridge
    name: devsecops-network

volumes:
  prometheus-data:
    name: devsecops-prometheus-data
  grafana-data:
    name: devsecops-grafana-data
